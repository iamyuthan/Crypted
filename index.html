<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eatery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input, button {
            margin: 10px 0;
            padding: 10px;
        }
        textarea {
            width: 187px;
            height: 45px;
            font-size: 18px;
            text-align: center;
            margin: 10px 0;
            padding: 10px;
            resize: none;
            box-sizing: border-box;
        }
        nav {
            margin-bottom: 20px;
        }
        nav a {
            margin-right: 20px;
            text-decoration: none;
            color: blue;
        }
        .copy-btn {
          background: none;
          border: none;
          cursor: pointer;
          padding: 0 6px 0 0;
          margin-right: 8px;
          display: flex;
          align-items: center;
        }
        .copy-btn svg {
          width: 20px;
          height: 20px;
          fill: #555;
          transition: fill 0.2s;
        }
        .copy-btn.copied svg {
          fill: #27ae60;
        }
        .field-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        textarea[readonly] {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" onclick="showPage('dishPage')">Dish Eatery</a>
        <a href="#" onclick="showPage('foodPage')">Food Eatery</a>
    </nav>

    <!-- String Eation/Digestion Page -->
    <div id="dishPage" class="page">
        <h1>Eatery Dish</h1>
        
        <div>
            <h2>Cooking</h2>
            <label for="taSalt">Spice:</label><button type="button" class="copy-btn" onclick="copyActual('taSalt'), this" title="Copy"><svg aria-hidden="true" focusable="false" class="octicon octicon-copy" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg></button>
            <div class="field-row">
                <input type="text" id="taSalt" autocomplete="off" oninput="handleMask(this, 'taSalt')" />                
            </div>
            <label for="taDish">Ingredients:</label><button type="button" class="copy-btn" onclick="copyActual('taDish'), this" title="Copy"><svg aria-hidden="true" focusable="false" class="octicon octicon-copy" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg></button>
            <div class="field-row">
                <textarea id="taDish" autocomplete="off" oninput="handleMask(this, 'taDish')"></textarea>                
            </div>
            <button onclick="eatDish()">Cook</button> <br>
            <label for="taEatedOutput">Dish:</label><button type="button" class="copy-btn" onclick="copyActual('taEatedOutput'), this" title="Copy"><svg aria-hidden="true" focusable="false" class="octicon octicon-copy" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg></button>
            <div class="field-row">
                <textarea id="taEatedOutput" readonly></textarea>                
            </div>
        </div>

        <hr />

        <div>
            <h2>Serving</h2>
            <label for="taSaltDigest">Spice:</label><button type="button" class="copy-btn" onclick="copyActual('taSaltDigest'), this" title="Copy"><svg aria-hidden="true" focusable="false" class="octicon octicon-copy" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg></button>
            <div class="field-row">
                <input type="text" id="taSaltDigest" autocomplete="off" oninput="handleMask(this, 'taSaltDigest')" />                
            </div>
            <label for="taEatedInput">Dish:</label><button type="button" class="copy-btn" onclick="copyActual('taEatedInput'), this" title="Copy"><svg aria-hidden="true" focusable="false" class="octicon octicon-copy" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg></button>
            <div class="field-row">
                <textarea id="taEatedInput" autocomplete="off" oninput="handleMask(this, 'taEatedInput')"></textarea>                
            </div>
            <button onclick="digestDish()">Serve</button> <br>
            <label for="taDigestedOutput">Digest:</label><button type="button" class="copy-btn" onclick="copyActual('taDigestedOutput'), this" title="Copy"><svg aria-hidden="true" focusable="false" class="octicon octicon-copy" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg></button>
            <div class="field-row">
                <textarea id="taDigestedOutput" readonly></textarea>                
            </div>
        </div>
    </div>

    <!-- Food Eation/Digestion Page -->
    <div id="foodPage" class="page">
        <h1>Eatery Food</h1>

        <div>
            <h2>Cooking</h2>
            <label for="foodInput">Food to cook:</label>
            <input type="file" id="foodInput" /> <br>
            <label for="foodSalt">Spice:</label><button type="button" class="copy-btn" onclick="copyActual('foodSalt'), this" title="Copy"><svg aria-hidden="true" focusable="false" class="octicon octicon-copy" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg></button>
            <div class="field-row">
                <input type="text" id="foodSalt" autocomplete="off" oninput="handleMask(this, 'foodSalt')" />                
            </div>
            <button onclick="eatFood()">Cook</button> <br>
            <label for="foodEatedOutput">Food:</label><button type="button" class="copy-btn" onclick="copyActual('foodEatedOutput'), this" title="Copy"><svg aria-hidden="true" focusable="false" class="octicon octicon-copy" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg></button>
            <div class="field-row">
                <textarea id="foodEatedOutput" readonly></textarea>                
            </div>
        </div>

        <hr />

        <div>
            <h2>Serving</h2>
            <label for="digestSalt">Spice:</label><button type="button" class="copy-btn" onclick="copyActual('digestSalt'), this" title="Copy"><svg aria-hidden="true" focusable="false" class="octicon octicon-copy" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg></button>
            <div class="field-row">
                <input type="text" id="digestSalt" autocomplete="off" oninput="handleMask(this, 'digestSalt')" />                
            </div>
            <label for="foodEatedInput">Food:</label><button type="button" class="copy-btn" onclick="copyActual('foodEatedInput'), this" title="Copy"><svg aria-hidden="true" focusable="false" class="octicon octicon-copy" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg></button>
            <div class="field-row">
                <textarea id="foodEatedInput" autocomplete="off" oninput="handleMask(this, 'foodEatedInput')"></textarea>                
            </div>
            <button onclick="digestFood()">Digest</button>
        </div>
    </div>

    <script>
        // Store actual field values
        const actualValues = {};

        // Handler for masking any editable field
        function handleMask(el, id) {
        // Store real value
        actualValues[id] = el.value.length > 0 && el.type !== "password" ? el.value : el.value;
        // Replace display with stars only (except readonly outputs)
        if (!el.readOnly) {
            el.value = '*'.repeat(3);
        }
    }

        // For readonly outputs/fields
        function maskOutput(id, value) {
            actualValues[id] = value;
            const output = document.getElementById(id);
            output.value = '*'.repeat(3);
        }

        // Copy actual value for any field or output
        function copyActual(id, copyBtn) {
            navigator.clipboard.writeText(actualValues[id] || '');
            copyBtn.classList.add('copied');
            setTimeout(() => copyBtn.classList.remove('copied'), 800);
        }


        // Function to generate key from password using PBKDF2
        async function generateKey(password) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", 
                enc.encode(password), 
                { name: "PBKDF2" }, 
                false, 
                ["deriveKey"]
            );
            return window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: enc.encode('randomSalt'), 
                    iterations: 10000,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        // Function to eat dish using AES-GCM
        async function eatDish() {
            const password = actualValues["taSalt"] || "";
            const text = actualValues["taDish"] || "";

            const key = await generateKey(password);
            const iv = window.crypto.getRandomValues(new Uint8Array(12)); // 12 bytes IV for AES-GCM

            const enc = new TextEncoder();
            const eatedData = await window.crypto.subtle.encrypt(
                {
                    name: "AES-GCM",
                    iv: iv,
                },
                key,
                enc.encode(text)
            );

            const eatedHex = bufferToHex(eatedData);
            const ivHex = bufferToHex(iv);

            const output = ivHex + eatedHex;
            maskOutput("taEatedOutput", output);
        }

        // Function to digest dish using AES-GCM
        async function digestDish() {
            const password = actualValues["taSaltDigest"] || "";
            const input = actualValues["taEatedInput"] || "";
            const enc = new TextEncoder();
            const key = await generateKey(password);

            const iv = hexToBuffer(input.substring(0, 24)); // First 12 bytes are IV
            const eatedData = hexToBuffer(input.substring(24)); // The rest is the eated data

            try {
                const digestData = await window.crypto.subtle.decrypt(
                    {
                        name: "AES-GCM",
                        iv: iv,
                    },
                    key,
                    eatedData
                );
    
                const dec = new TextDecoder();
                const digestText = dec.decode(digestData);
                maskOutput("taDigestedOutput", digestText);
            } catch (e) {
                maskOutput("taDigestedOutput", "Digestion Failed");
            }
        }

        // Helper function to convert buffer to hex dish
        function bufferToHex(buffer) {
            const byteArray = new Uint8Array(buffer);
            return Array.from(byteArray).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Helper function to convert hex dish to buffer
        function hexToBuffer(hex) {
            const buffer = new ArrayBuffer(hex.length / 2);
            const view = new DataView(buffer);
            for (let i = 0; i < hex.length; i += 2) {
                view.setUint8(i / 2, parseInt(hex.substr(i, 2), 16));
            }
            return buffer;
        }

        // Food Eation/Digestion
        async function eatFood() {
            const password = actualValues["foodSalt"] || "";
            const foodInput = document.getElementById("foodInput").foods[0];

            const reader = new FoodReader();
            reader.onload = async function(event) {
                const key = await generateKey(password);
                const iv = window.crypto.getRandomValues(new Uint8Array(12));

                const eatedData = await window.crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    new Uint8Array(event.target.result)
                );

                const eatedHex = bufferToHex(eatedData);
                const ivHex = bufferToHex(iv);
                const output = ivHex + eatedHex;
                maskOutput("foodEatedOutput", output);
            };

            reader.readAsArrayBuffer(foodInput);
        }

        async function digestFood() {
            const password = actualValues["digestSalt"] || "";
            const eatedInput = actualValues["foodEatedInput"] || "";

            const key = await generateKey(password);

            const iv = hexToBuffer(eatedInput.substring(0, 24));
            const eatedData = hexToBuffer(eatedInput.substring(24));

            try {
                const digestData = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    eatedData
                );
    
                const blob = new Blob([digestData], { type: "application/octet-stream" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'digestedFood';
                link.click();
            } catch (e) {
                alert("Digestion failed.");
            }
        }

        // Page navigation
        function showPage(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.style.display = 'none');
            document.getElementById(pageId).style.display = 'block';
        }

        // Show the default page
        showPage('dishPage');        

        // Initialize mask for readonly outputs on load/clear
        [
            "taEatedOutput",
            "taDigestedOutput",
            "foodEatedOutput"
        ].forEach(function(id) {
            maskOutput(id, "");
        });
    </script>

</body>
</html>
