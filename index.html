<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypted</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input, button {
            margin: 10px 0;
            padding: 10px;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-top: 10px;
            padding: 10px;
        }
        nav {
            margin-bottom: 20px;
        }
        nav a {
            margin-right: 20px;
            text-decoration: none;
            color: blue;
        }
        .copy-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            vertical-align: middle;
            margin-left: 5px;
            font-size: 20px;
        }
        .field-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        textarea[readonly] {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" onclick="showPage('stringPage')">String Crypted</a>
        <a href="#" onclick="showPage('filePage')">File Crypted</a>
    </nav>

    <!-- String Encryption/Decryption Page -->
    <div id="stringPage" class="page">
        <h1>Crypted String</h1>
        
        <div>
            <h2>Encrypt String</h2>
            <label for="aesSalt">Enter Secret Salt (Password):</label>
            <div class="field-row">
                <input type="text" id="aesSalt" autocomplete="off" oninput="handleMask(this, 'aesSalt')" />
                <button type="button" class="copy-btn" onclick="copyActual('aesSalt')" title="Copy"><span>📋</span></button>
            </div>
            <label for="aesString">Enter String to Encrypt:</label>
            <div class="field-row">
                <textarea id="aesString" autocomplete="off" oninput="handleMask(this, 'aesString')"></textarea>
                <button type="button" class="copy-btn" onclick="copyActual('aesString')" title="Copy"><span>📋</span></button>
            </div>
            <button onclick="encryptString()">Encrypt</button> 
            <h3>Encrypted String:</h3>
            <div class="field-row">
                <textarea id="aesEncryptedOutput" readonly></textarea>
                <button type="button" class="copy-btn" onclick="copyActual('aesEncryptedOutput')" title="Copy"><span>📋</span></button>
            </div>
        </div>

        <hr />

        <div>
            <h2>Decrypt String</h2>
            <label for="aesSaltDecrypt">Enter Secret Salt (Password):</label>
            <div class="field-row">
                <input type="text" id="aesSaltDecrypt" autocomplete="off" oninput="handleMask(this, 'aesSaltDecrypt')" />
                <button type="button" class="copy-btn" onclick="copyActual('aesSaltDecrypt')" title="Copy"><span>📋</span></button>
            </div>
            <label for="aesEncryptedInput">Enter Encrypted String:</label>
            <div class="field-row">
                <textarea id="aesEncryptedInput" autocomplete="off" oninput="handleMask(this, 'aesEncryptedInput')"></textarea>
                <button type="button" class="copy-btn" onclick="copyActual('aesEncryptedInput')" title="Copy"><span>📋</span></button>
            </div>
            <button onclick="decryptString()">Decrypt</button>
            <h3>Decrypted String:</h3>
            <div class="field-row">
                <textarea id="aesDecryptedOutput" readonly></textarea>
                <button type="button" class="copy-btn" onclick="copyActual('aesDecryptedOutput')" title="Copy"><span>📋</span></button>
            </div>
        </div>
    </div>

    <!-- File Encryption/Decryption Page -->
    <div id="filePage" class="page">
        <h1>Crypted File</h1>

        <div>
            <h2>Encrypt File</h2>
            <label for="fileInput">Select File to Encrypt:</label>
            <input type="file" id="fileInput" />
            <label for="fileSalt">Enter Secret Salt (Password):</label>
            <div class="field-row">
                <input type="text" id="fileSalt" autocomplete="off" oninput="handleMask(this, 'fileSalt')" />
                <button type="button" class="copy-btn" onclick="copyActual('fileSalt')" title="Copy"><span>📋</span></button>
            </div>
            <button onclick="encryptFile()">Encrypt File</button>
            <h3>Encrypted String:</h3>
            <div class="field-row">
                <textarea id="fileEncryptedOutput" readonly></textarea>
                <button type="button" class="copy-btn" onclick="copyActual('fileEncryptedOutput')" title="Copy"><span>📋</span></button>
            </div>
        </div>

        <hr />

        <div>
            <h2>Decrypt File</h2>
            <label for="decryptSalt">Enter Secret Salt (Password):</label>
            <div class="field-row">
                <input type="text" id="decryptSalt" autocomplete="off" oninput="handleMask(this, 'decryptSalt')" />
                <button type="button" class="copy-btn" onclick="copyActual('decryptSalt')" title="Copy"><span>📋</span></button>
            </div>
            <label for="fileEncryptedInput">Enter Encrypted String:</label>
            <div class="field-row">
                <textarea id="fileEncryptedInput" autocomplete="off" oninput="handleMask(this, 'fileEncryptedInput')"></textarea>
                <button type="button" class="copy-btn" onclick="copyActual('fileEncryptedInput')" title="Copy"><span>📋</span></button>
            </div>
            <button onclick="decryptFile()">Decrypt File</button>
        </div>
    </div>

    <script>
        // Store actual field values
        const actualValues = {};

        // Handler for masking any editable field
        function handleMask(el, id) {
            // Only store/add new typed/inserted values for editables
            if (el.type === "text" || el.tagName === "TEXTAREA") {
                let prev = actualValues[id] || "";
                if (el.value.length < prev.length) {
                    // Removing previous chars
                    actualValues[id] = prev.slice(0, el.value.length);
                } else {
                    // Add typed char (take new input diff)
                    const diff = el.value.length - prev.length;
                    const newChar = diff > 0 ? el.value.slice(-diff) : '';
                    actualValues[id] = prev + newChar;
                }
                // Mask display
                el.value = "*".repeat(actualValues[id].length);
            }
        }

        // For readonly outputs/fields
        function maskOutput(id, value) {
            actualValues[id] = value;
            const output = document.getElementById(id);
            output.value = "*".repeat(value.length);
        }

        // Copy actual value for any field or output
        function copyActual(id) {
            navigator.clipboard.writeText(actualValues[id] || '');
        }

        // Function to generate key from password using PBKDF2
        async function generateKey(password) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", 
                enc.encode(password), 
                { name: "PBKDF2" }, 
                false, 
                ["deriveKey"]
            );
            return window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: enc.encode('randomSalt'), 
                    iterations: 10000,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        // Function to encrypt string using AES-GCM
        async function encryptString() {
            const password = actualValues["aesSalt"] || "";
            const text = actualValues["aesString"] || "";

            const key = await generateKey(password);
            const iv = window.crypto.getRandomValues(new Uint8Array(12)); // 12 bytes IV for AES-GCM

            const enc = new TextEncoder();
            const encryptedData = await window.crypto.subtle.encrypt(
                {
                    name: "AES-GCM",
                    iv: iv,
                },
                key,
                enc.encode(text)
            );

            const encryptedHex = bufferToHex(encryptedData);
            const ivHex = bufferToHex(iv);

            const output = ivHex + encryptedHex;
            maskOutput("aesEncryptedOutput", output);
        }

        // Function to decrypt string using AES-GCM
        async function decryptString() {
            const password = actualValues["aesSaltDecrypt"] || "";
            const input = actualValues["aesEncryptedInput"] || "";
            const enc = new TextEncoder();
            const key = await generateKey(password);

            const iv = hexToBuffer(input.substring(0, 24)); // First 12 bytes are IV
            const encryptedData = hexToBuffer(input.substring(24)); // The rest is the encrypted data

            try {
                const decryptedData = await window.crypto.subtle.decrypt(
                    {
                        name: "AES-GCM",
                        iv: iv,
                    },
                    key,
                    encryptedData
                );
    
                const dec = new TextDecoder();
                const decryptedText = dec.decode(decryptedData);
                maskOutput("aesDecryptedOutput", decryptedText);
            } catch (e) {
                maskOutput("aesDecryptedOutput", "Decryption Failed");
            }
        }

        // Helper function to convert buffer to hex string
        function bufferToHex(buffer) {
            const byteArray = new Uint8Array(buffer);
            return Array.from(byteArray).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Helper function to convert hex string to buffer
        function hexToBuffer(hex) {
            const buffer = new ArrayBuffer(hex.length / 2);
            const view = new DataView(buffer);
            for (let i = 0; i < hex.length; i += 2) {
                view.setUint8(i / 2, parseInt(hex.substr(i, 2), 16));
            }
            return buffer;
        }

        // File Encryption/Decryption
        async function encryptFile() {
            const password = actualValues["fileSalt"] || "";
            const fileInput = document.getElementById("fileInput").files[0];

            const reader = new FileReader();
            reader.onload = async function(event) {
                const key = await generateKey(password);
                const iv = window.crypto.getRandomValues(new Uint8Array(12));

                const encryptedData = await window.crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    new Uint8Array(event.target.result)
                );

                const encryptedHex = bufferToHex(encryptedData);
                const ivHex = bufferToHex(iv);
                const output = ivHex + encryptedHex;
                maskOutput("fileEncryptedOutput", output);
            };

            reader.readAsArrayBuffer(fileInput);
        }

        async function decryptFile() {
            const password = actualValues["decryptSalt"] || "";
            const encryptedInput = actualValues["fileEncryptedInput"] || "";

            const key = await generateKey(password);

            const iv = hexToBuffer(encryptedInput.substring(0, 24));
            const encryptedData = hexToBuffer(encryptedInput.substring(24));

            try {
                const decryptedData = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    encryptedData
                );
    
                const blob = new Blob([decryptedData], { type: "application/octet-stream" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'decryptedFile';
                link.click();
            } catch (e) {
                alert("Decryption failed.");
            }
        }

        // Page navigation
        function showPage(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.style.display = 'none');
            document.getElementById(pageId).style.display = 'block';
        }

        // Show the default page
        showPage('stringPage');        

        // Initialize mask for readonly outputs on load/clear
        [
            "aesEncryptedOutput",
            "aesDecryptedOutput",
            "fileEncryptedOutput"
        ].forEach(function(id) {
            maskOutput(id, "");
        });
    </script>

</body>
</html>
